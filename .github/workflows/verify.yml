name: Verify formatter and Office add-in
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - run: python scripts/create_samples.py
      - run: dotnet run --project tests/Gongwen.Tests -c Release -- .
      - run: dotnet run --project tests/Gongwen.OfficeAddin.Tests -c Release
      - run: dotnet run --project tests/Gongwen.Integration.Tests -c Release
      - run: python scripts/publication_scan.py
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.x'
      - name: Install build tools
        shell: powershell
        run: choco install nsis 7zip --no-progress -y
      - name: Build and verify package
        shell: powershell
        run: |
          $env:PATH += ';C:\Program Files (x86)\NSIS;C:\Program Files\7-Zip'
          python scripts/build.py --dotnet dotnet --runtime-version 10.0.13
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify_installer.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\scripts\windows_install_check.ps1 -Installer (Get-ChildItem work\*_Setup_*_x64.exe | Select-Object -First 1).FullName
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-package-verification
          path: |
            evidence/*.json
            work/*_Setup_*_x64.exe
          if-no-files-found: warn
